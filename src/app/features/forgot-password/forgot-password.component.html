<div class="min-h-screen flex">
  <!-- Left Image -->
  <div class="hidden lg:flex w-1/2 bg-[#CBE4E8] items-center justify-center">
    <img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=600&h=700&fit=crop"
      alt="Reset Password" class="max-h-[600px] object-contain"/>
  </div>

  <!-- Right Panel -->
  <div class="flex-1 flex items-center justify-center px-8 py-16">
    <div class="w-full max-w-sm">

      @if (step() === 'email') {
        <h1 class="text-3xl font-semibold text-black mb-2">Forgot Password?</h1>
        <p class="text-gray-500 text-sm mb-8">Enter your email to receive a reset code</p>

        <form [formGroup]="emailForm" (ngSubmit)="sendEmail()" class="space-y-6">
          <div>
            <input type="email" formControlName="email" placeholder="Enter your email"
              class="form-input-exclusive"/>
          </div>
          <button type="submit" [disabled]="isLoading()"
            class="btn-exclusive w-full py-3 disabled:opacity-60">
            {{ isLoading() ? 'Sending...' : 'Send Code' }}
          </button>
        </form>
      }

      @if (step() === 'code') {
        <h1 class="text-3xl font-semibold text-black mb-2">Enter Reset Code</h1>
        <p class="text-gray-500 text-sm mb-8">Check your email for the 6-digit code</p>

        <form [formGroup]="codeForm" (ngSubmit)="verifyCode()" class="space-y-6">
          <div>
            <input type="text" formControlName="resetCode" placeholder="Enter 6-digit code" maxlength="6"
              class="form-input-exclusive text-center tracking-widest text-xl font-bold"/>
          </div>
          <button type="submit" [disabled]="isLoading()"
            class="btn-exclusive w-full py-3 disabled:opacity-60">
            {{ isLoading() ? 'Verifying...' : 'Verify Code' }}
          </button>
        </form>
      }

      @if (step() === 'reset') {
        <h1 class="text-3xl font-semibold text-black mb-2">New Password</h1>
        <p class="text-gray-500 text-sm mb-8">Set your new secure password</p>

        <form [formGroup]="resetForm" (ngSubmit)="resetPassword()" class="space-y-6">
          <div>
            <input type="password" formControlName="newPassword" placeholder="New password (min 6 chars)"
              class="form-input-exclusive"/>
          </div>
          <button type="submit" [disabled]="isLoading()"
            class="btn-exclusive w-full py-3 disabled:opacity-60">
            {{ isLoading() ? 'Resetting...' : 'Reset Password' }}
          </button>
        </form>
      }

      <div class="text-center mt-6">
        <a routerLink="/login" class="text-exclusive text-sm hover:underline flex items-center justify-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          Back to Login
        </a>
      </div>

    </div>
  </div>
</div>
